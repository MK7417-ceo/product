services:
  core:
    build: ./part-1-core
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://skillforge:skillforge@db:5432/skillforge
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillforge
      POSTGRES_PASSWORD: skillforge
      POSTGRES_DB: skillforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NOTE: part-2-code-engine gets its OWN isolated host in production.
    # It is intentionally not in this compose file.

volumes:
  pgdata:
